name: Deploy Server to Azure Container Apps

on:
  push:
    branches:
      - main
      - develop
    # 서버 이미지 빌드 입력 전체 (apps/server/Dockerfile이 복사하는 공용 설정과 core 포함)
    paths:
      - ".github/workflows/deploy-server.yml"
      - "apps/server/**"
      - "packages/core/**"
      - "packages/tsconfig.json"
      - "packages/tsup.config.base.ts"
      - "tsconfig.base.json"
      - "turbo.json"
      - ".npmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  # 수동 배포 트리거 (원할 때 버튼을 눌러서 배포 가능)
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY: "bookjeokacr0871"
  CONTAINER_APP_NAME: "bookjeok-server"
  RESOURCE_GROUP: "bookjeok-rg"

jobs:
  # 배포할 커밋과 같은 SHA에서 서버와 의존 패키지를 검증한다
  verify:
    runs-on: ubuntu-latest
    env:
      # core 타입 선언 빌드가 기본 힙으로는 부족하다 (Dockerfile과 동일)
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, Test and Build
        run: pnpm turbo lint test build --filter=@bookjeok/server...

  build-and-deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.AZURE_CONTAINER_REGISTRY }}

      - name: Build and Push Docker image
        run: |
          IMAGE_TAG=${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}

          # 모노레포 구조를 위해 루트에서 빌드 컨텍스트(.)를 잡고 Dockerfile은 -f로 지정
          docker build -f apps/server/Dockerfile -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          imageToDeploy: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}
          registryUrl: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io
          registryUsername: ${{ secrets.REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.REGISTRY_PASSWORD }}
