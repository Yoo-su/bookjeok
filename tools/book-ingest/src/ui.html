<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="ingest-token" content="__INGEST_TOKEN__" />
    <title>북적 신간 적재</title>
    <style>
      :root {
        --bg: #fafaf9;
        --panel: #ffffff;
        --ink: #1c1917;
        --muted: #78716c;
        --line: #e7e5e4;
        --strong-line: #1c1917;
        --ok: #166534;
        --warn: #92400e;
        --bad: #b91c1c;
        --chip-on-bg: #1c1917;
        --chip-on-ink: #fafaf9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0a09;
          --panel: #1c1917;
          --ink: #f5f5f4;
          --muted: #a8a29e;
          --line: #292524;
          --strong-line: #f5f5f4;
          --ok: #4ade80;
          --warn: #fbbf24;
          --bad: #f87171;
          --chip-on-bg: #f5f5f4;
          --chip-on-ink: #0c0a09;
        }
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.5 system-ui,
          -apple-system,
          "Apple SD Gothic Neo",
          "Malgun Gothic",
          sans-serif;
      }
      header,
      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 20px;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding-top: 24px;
        padding-bottom: 8px;
      }
      h1 {
        font-size: 20px;
        margin: 0;
        letter-spacing: -0.02em;
      }
      h2 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      section.panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
        margin: 16px 0;
      }
      input[type="search"],
      select {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 10px;
      }
      input[type="search"] {
        width: 240px;
      }
      #searchText {
        width: 320px;
        max-width: 100%;
      }
      button {
        font: inherit;
        cursor: pointer;
        color: inherit;
        background: transparent;
        border: 1px solid var(--strong-line);
        border-radius: 6px;
        padding: 6px 14px;
        transition: transform 80ms ease;
      }
      button:active {
        transform: translateY(1px);
      }
      button.primary {
        background: var(--ink);
        color: var(--bg);
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
        max-height: 260px;
        overflow: auto;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 4px 3px 12px;
        user-select: none;
        transition:
          background 120ms ease,
          color 120ms ease,
          transform 120ms ease;
      }
      .chip:hover {
        border-color: var(--strong-line);
      }
      .chip.on {
        background: var(--chip-on-bg);
        color: var(--chip-on-ink);
        border-color: var(--chip-on-bg);
        transform: scale(1.04);
      }
      .chip .pick {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 0;
        padding: 0;
        color: inherit;
      }
      .chip .pick:focus-visible,
      .chip .star:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }
      .chip .count {
        font-size: 11px;
        opacity: 0.6;
      }
      .chip .star {
        border: 0;
        padding: 0 6px;
        font-size: 14px;
        line-height: 1;
        opacity: 0.45;
      }
      .chip .star.fav {
        opacity: 1;
      }
      .chip .star:hover {
        opacity: 1;
      }
      .progress-line {
        font-variant-numeric: tabular-nums;
      }
      .pub {
        margin: 24px 0;
      }
      .pub-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        border-bottom: 1px solid var(--strong-line);
        padding-bottom: 6px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 14px;
        margin-top: 12px;
      }
      .card {
        position: relative;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
        background: var(--panel);
        cursor: pointer;
        transition:
          opacity 150ms ease,
          border-color 150ms ease;
      }
      .card.off {
        opacity: 0.35;
      }
      .card img {
        width: 100%;
        aspect-ratio: 120 / 174;
        object-fit: cover;
        border-radius: 3px;
        background: var(--line);
        display: block;
      }
      .card .title {
        font-weight: 600;
        margin-top: 6px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card .meta {
        font-size: 12px;
        color: var(--muted);
      }
      .card input {
        position: absolute;
        top: 12px;
        left: 12px;
        width: 18px;
        height: 18px;
        accent-color: var(--ink);
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        border: 1px solid currentColor;
        border-radius: 4px;
        padding: 0 4px;
        margin-left: 4px;
      }
      .stamp {
        position: absolute;
        inset: 30% 8px auto;
        text-align: center;
        font-weight: 800;
        font-size: 18px;
        border: 3px solid currentColor;
        border-radius: 6px;
        padding: 4px;
        background: var(--panel);
        transform: rotate(-12deg) scale(0.4);
        opacity: 0;
        pointer-events: none;
      }
      .stamp.show {
        animation: stamp 260ms cubic-bezier(0.2, 1.6, 0.4, 1) forwards;
      }
      .stamp.inserted {
        color: var(--ok);
      }
      .stamp.already_exists {
        color: var(--warn);
      }
      .stamp.failed {
        color: var(--bad);
      }
      @keyframes stamp {
        to {
          transform: rotate(-12deg) scale(1);
          opacity: 0.95;
        }
      }
      details {
        margin-top: 10px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12px;
      }
      td,
      th {
        text-align: left;
        border-bottom: 1px solid var(--line);
        padding: 4px 6px;
      }
      .applybar {
        position: sticky;
        bottom: 0;
        background: var(--panel);
        border-top: 1px solid var(--strong-line);
        padding: 12px 20px;
        display: none;
      }
      .applybar.show {
        display: block;
      }
      .applybar .inner {
        max-width: 1080px;
        margin: 0 auto;
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }
      .meter {
        height: 6px;
        background: var(--line);
        border-radius: 3px;
        overflow: hidden;
        flex: 1;
        max-width: 360px;
      }
      .meter > div {
        height: 100%;
        width: 0;
        background: var(--ink);
        transition: width 200ms ease;
      }
      .log {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        max-height: 25vh;
        overflow: auto;
      }
      .error {
        color: var(--bad);
      }
      .segmented {
        display: inline-flex;
        border: 1px solid var(--strong-line);
        border-radius: 6px;
        overflow: hidden;
      }
      .segmented label {
        position: relative;
        padding: 6px 12px;
        cursor: pointer;
        transition: background 120ms ease;
      }
      .segmented label + label {
        border-left: 1px solid var(--strong-line);
      }
      .segmented input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .segmented label:has(input:checked) {
        background: var(--ink);
        color: var(--bg);
      }
      .segmented label:has(input:disabled) {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .segmented label:has(input:focus-visible) {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      .toolbar {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--bg);
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .toolbar input[type="search"] {
        width: 220px;
      }
      .card:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      .card:hover {
        border-color: var(--strong-line);
      }
      .card .sales {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      dialog {
        width: min(760px, calc(100vw - 32px));
        max-height: calc(100dvh - 48px);
        border: 1px solid var(--strong-line);
        border-radius: 10px;
        padding: 0;
        background: var(--panel);
        color: var(--ink);
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 0.45);
      }
      .detail-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
      }
      .detail-body {
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 16px;
        padding: 16px;
        overflow: auto;
        max-height: calc(100dvh - 120px);
      }
      .detail-body img {
        width: 100%;
        border-radius: 4px;
        background: var(--line);
      }
      .detail-body h3 {
        margin: 0 0 8px;
        font-size: 17px;
      }
      .detail-body dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 2px 12px;
        margin: 0 0 12px;
        font-size: 13px;
      }
      .detail-body dt {
        color: var(--muted);
      }
      .detail-body dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .description {
        white-space: pre-wrap;
        font-size: 13px;
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }
      .mode-row {
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
      }
      @media (max-width: 560px) {
        .detail-body {
          grid-template-columns: 1fr;
        }
        .detail-body img {
          max-width: 160px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>북적 신간 적재</h1>
      <span class="muted small" id="target"></span>
    </header>
    <main>
      <section class="panel">
        <div class="row mode-row" style="justify-content: space-between">
          <div class="segmented" role="radiogroup" aria-label="찾는 방법">
            <label
              ><input
                type="radio"
                name="mode"
                value="publisher"
                checked
              />출판사 신간</label
            >
            <label
              ><input type="radio" name="mode" value="keyword" />책 검색</label
            >
          </div>
          <div class="row">
            <span class="small muted">공급처</span>
            <div
              class="segmented"
              id="sources"
              role="radiogroup"
              aria-label="공급처"
            ></div>
          </div>
        </div>

        <div id="publisherMode">
          <div class="row" style="justify-content: space-between">
            <h2 style="margin: 0">출판사</h2>
            <div class="row">
              <input
                type="search"
                id="filter"
                placeholder="출판사 이름으로 거르기"
              />
              <label class="small muted"
                >최대
                <select id="maxPages"></select>
              </label>
              <button class="primary" id="scanBtn" disabled>신간 찾기</button>
            </div>
          </div>
          <p class="small muted" id="selectedLine">
            ★ 즐겨찾기가 앞에 옵니다. 칩을 눌러 고르세요.
          </p>
          <div class="chips" id="chips"></div>
          <p class="small muted" id="chipNote"></p>
        </div>

        <form id="keywordMode" class="row" hidden>
          <input
            type="search"
            id="searchText"
            placeholder="제목·저자·ISBN"
            aria-label="검색어"
            maxlength="100"
          />
          <select id="searchField" aria-label="검색 대상">
            <option value="all">전체</option>
            <option value="title">제목</option>
            <option value="author">저자</option>
          </select>
          <select id="searchSort" aria-label="공급처 정렬">
            <option value="accuracy">정확도순</option>
            <option value="latest">최신순</option>
          </select>
          <label class="small muted"
            >최대
            <select id="searchPages"></select>
          </label>
          <button class="primary" id="searchBtn" type="submit" disabled>
            검색
          </button>
        </form>

        <p class="small muted" id="sourceNote"></p>
      </section>

      <section class="panel" id="progressPanel" hidden>
        <h2>진행</h2>
        <div id="progress" class="progress-line small"></div>
      </section>

      <div class="toolbar row" id="toolbar" hidden>
        <input
          type="search"
          id="query"
          placeholder="제목·저자로 거르기"
          aria-label="결과를 제목·저자로 거르기"
        />
        <label class="small"
          ><input type="checkbox" id="hidePreorder" /> 예약판매 숨기기</label
        >
        <label class="small muted"
          >정렬
          <select id="sort">
            <option value="source">공급처 순서</option>
            <option value="date">출간일 최신순</option>
            <option value="sales">판매지수 높은순</option>
            <option value="title">제목순</option>
          </select>
        </label>
        <span class="small muted" id="viewCount"></span>
      </div>

      <div id="results"></div>
    </main>

    <div class="applybar" id="applybar">
      <div class="inner">
        <span id="applyCount"></span>
        <div class="meter"><div id="meter"></div></div>
        <button class="primary" id="applyBtn">적재</button>
      </div>
      <div class="log inner" id="log"></div>
    </div>

    <dialog id="detail" aria-labelledby="detailTitle">
      <div class="detail-head">
        <div class="row">
          <button id="prevBtn" aria-label="이전 책">←</button>
          <button id="nextBtn" aria-label="다음 책">→</button>
          <span class="small muted" id="detailPos"></span>
        </div>
        <div class="row">
          <label class="small"
            ><input type="checkbox" id="detailPick" /> 적재 대상</label
          >
          <button id="closeBtn">닫기</button>
        </div>
      </div>
      <div class="detail-body">
        <img id="detailImg" alt="" referrerpolicy="no-referrer" />
        <div>
          <h3 id="detailTitle"></h3>
          <dl id="detailMeta"></dl>
          <div class="description" id="detailDesc"></div>
        </div>
      </div>
    </dialog>

    <script>
      const TOKEN = document.querySelector('meta[name="ingest-token"]').content;
      const $ = (id) => document.getElementById(id);
      const el = (tag, props = {}, children = []) => {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(props)) {
          if (k === "class") node.className = v;
          else if (k === "text") node.textContent = v;
          else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
          else node.setAttribute(k, v);
        }
        for (const child of [].concat(children)) if (child) node.append(child);
        return node;
      };
      const SOURCE_KEY = "book-ingest:source";
      const MODE_KEY = "book-ingest:mode";
      const store = {
        get(key) {
          try {
            return localStorage.getItem(key);
          } catch {
            return null;
          }
        },
        set(key, value) {
          try {
            localStorage.setItem(key, value);
          } catch {}
        },
      };

      const state = {
        mode: "publisher",
        sources: [],
        source: null,
        publishers: [],
        favorites: new Set(),
        selected: new Set(),
        scanId: null,
        scanSource: null,
        // isbn -> { book, order, checked, done, card, stamp, box, section }
        fresh: new Map(),
        sections: [],
        view: { query: "", hidePreorder: false, sort: "source" },
        detail: null,
        busy: false,
      };

      async function api(path, options = {}) {
        const res = await fetch(path, {
          ...options,
          headers: {
            "x-ingest-token": TOKEN,
            "content-type": "application/json",
          },
        });
        if (!res.ok)
          throw new Error(
            (await res.json().catch(() => ({}))).error || `HTTP ${res.status}`,
          );
        return res;
      }

      async function stream(path, body, onEvent) {
        const res = await api(path, {
          method: "POST",
          body: JSON.stringify(body),
        });
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let nl;
          while ((nl = buffer.indexOf("\n")) >= 0) {
            const line = buffer.slice(0, nl).trim();
            buffer = buffer.slice(nl + 1);
            if (line) onEvent(JSON.parse(line));
          }
        }
      }

      const sourceById = (id) => state.sources.find((s) => s.id === id);
      const won = (n) => `${Number(n).toLocaleString()}원`;

      // ── 공급처 ────────────────────────────────────────────────

      function renderSources() {
        $("sources").replaceChildren(
          ...state.sources.map((s) => {
            const input = el("input", {
              type: "radio",
              name: "source",
              value: s.id,
            });
            input.checked = s.id === state.source;
            input.disabled = !s.available || state.busy;
            input.addEventListener("change", () => selectSource(s.id));
            return el(
              "label",
              { title: s.available ? "" : `${s.envKey}가 없어 쓸 수 없습니다` },
              [input, document.createTextNode(s.label)],
            );
          }),
        );
        const current = sourceById(state.source);
        $("sourceNote").textContent = current
          ? `${current.label}: 최대 ${current.maxPages}페이지(${(current.maxPages * 50).toLocaleString()}권)까지 조회합니다.` +
            (current.enrichNote ? ` ${current.enrichNote}` : "") +
            ` ${current.dimensionNote}`
          : "쓸 수 있는 공급처가 없습니다. .env에 키를 넣으세요.";
      }

      function renderMaxPages() {
        const current = sourceById(state.source);
        const max = current?.maxPages ?? 1;
        const pages = [...new Set([1, 2, 5, max].filter((n) => n <= max))];
        const options = () =>
          pages.map((n) =>
            el("option", {
              value: String(n),
              text:
                n === max
                  ? `끝까지 (${(n * 50).toLocaleString()}권)`
                  : `${n}페이지 (${n * 50}권)`,
            }),
          );
        // 출판사 신간은 끝까지, 검색은 정확도순 앞쪽만 보면 충분하다
        $("maxPages").replaceChildren(...options());
        $("maxPages").value = String(max);
        $("searchPages").replaceChildren(...options());
        $("searchPages").value = "1";
      }

      function selectSource(id) {
        state.source = id;
        store.set(SOURCE_KEY, id);
        renderSources();
        renderMaxPages();
        renderChips();
        renderSearch();
      }

      // ── 찾는 방법 ─────────────────────────────────────────────

      function selectMode(mode) {
        state.mode = mode === "keyword" ? "keyword" : "publisher";
        store.set(MODE_KEY, state.mode);
        document.querySelector(
          `input[name="mode"][value="${state.mode}"]`,
        ).checked = true;
        $("publisherMode").hidden = state.mode !== "publisher";
        $("keywordMode").hidden = state.mode !== "keyword";
        if (state.mode === "keyword") $("searchText").focus();
      }

      function renderSearch() {
        $("searchBtn").disabled =
          state.busy ||
          !$("searchText").value.trim() ||
          !sourceById(state.source);
      }

      document
        .querySelectorAll('input[name="mode"]')
        .forEach((input) =>
          input.addEventListener("change", () => selectMode(input.value)),
        );

      // ── 출판사 칩 ─────────────────────────────────────────────

      function renderChips() {
        const q = $("filter").value.trim();
        const list = [...state.publishers]
          .filter(
            (p) =>
              !q || p.publisher.includes(q) || state.selected.has(p.publisher),
          )
          .sort(
            (a, b) =>
              Number(state.favorites.has(b.publisher)) -
              Number(state.favorites.has(a.publisher)),
          );
        const shown = list.slice(0, 200);
        $("chips").replaceChildren(
          ...shown.map((p) => {
            const fav = state.favorites.has(p.publisher);
            const on = state.selected.has(p.publisher);
            return el("span", { class: "chip" + (on ? " on" : "") }, [
              el(
                "button",
                {
                  class: "pick",
                  "aria-pressed": String(on),
                  onclick: () => {
                    on
                      ? state.selected.delete(p.publisher)
                      : state.selected.add(p.publisher);
                    renderChips();
                  },
                },
                [
                  el("span", { text: p.publisher }),
                  el("span", {
                    class: "count",
                    text: p.count.toLocaleString(),
                  }),
                ],
              ),
              el("button", {
                class: "star" + (fav ? " fav" : ""),
                "aria-label": `${p.publisher} ${fav ? "즐겨찾기 해제" : "즐겨찾기"}`,
                title: fav ? "즐겨찾기 해제" : "즐겨찾기",
                text: fav ? "★" : "☆",
                onclick: () => toggleFavorite(p.publisher),
              }),
            ]);
          }),
        );
        $("chipNote").textContent =
          list.length > shown.length
            ? `${list.length - shown.length}곳 더 있음 — 이름으로 거르세요`
            : "";
        const sel = [...state.selected];
        $("selectedLine").textContent = sel.length
          ? `선택: ${sel.join(", ")}`
          : "★ 즐겨찾기가 앞에 옵니다. 칩을 눌러 고르세요.";
        $("scanBtn").disabled =
          state.busy || sel.length === 0 || !sourceById(state.source);
      }

      async function toggleFavorite(name) {
        state.favorites.has(name)
          ? state.favorites.delete(name)
          : state.favorites.add(name);
        renderChips();
        const res = await api("/api/favorites", {
          method: "PUT",
          body: JSON.stringify([...state.favorites]),
        });
        state.favorites = new Set(await res.json());
      }

      function setBusy(busy) {
        state.busy = busy;
        renderSources();
        renderChips();
        renderSearch();
        updateApplyBar();
      }

      // ── 결과 보기: 거르기·정렬 ────────────────────────────────

      function isVisible(entry) {
        const { book } = entry;
        if (state.view.hidePreorder && book.preorder) return false;
        const q = state.view.query;
        if (!q) return true;
        return [book.title, book.author, ...book.translators]
          .join(" ")
          .toLowerCase()
          .includes(q);
      }

      const SORTS = {
        source: () => 0,
        date: (a, b) =>
          (b.book.pubDate ?? "").localeCompare(a.book.pubDate ?? ""),
        sales: (a, b) => (b.book.salesPoint ?? -1) - (a.book.salesPoint ?? -1),
        title: (a, b) => a.book.title.localeCompare(b.book.title, "ko"),
      };

      function orderedEntries(section) {
        const compare = SORTS[state.view.sort];
        return [...section.entries].sort(
          (a, b) => compare(a, b) || a.order - b.order,
        );
      }

      /** 화면 순서대로 보이는 책. 상세 보기의 이전·다음이 이 순서를 따릅니다. */
      function visibleEntries() {
        return state.sections.flatMap((s) =>
          orderedEntries(s).filter(isVisible),
        );
      }

      function applyView() {
        let visible = 0;
        for (const section of state.sections) {
          const entries = orderedEntries(section);
          let shown = 0;
          for (const entry of entries) {
            entry.card.hidden = !isVisible(entry);
            if (!entry.card.hidden) shown += 1;
          }
          section.grid.append(...entries.map((e) => e.card));
          section.count.textContent =
            shown === section.entries.length
              ? ""
              : `보이는 ${shown} / ${section.entries.length}`;
          visible += shown;
        }
        $("viewCount").textContent =
          `보이는 ${visible}권 / 신규 ${state.fresh.size}권`;
        updateApplyBar();
      }

      function selectedEntries() {
        return [...state.fresh.values()].filter((e) => e.checked && !e.done);
      }

      function updateApplyBar() {
        const picked = selectedEntries();
        const applicable = picked.filter(isVisible);
        const hidden = picked.length - applicable.length;
        $("applybar").classList.toggle("show", state.fresh.size > 0);
        $("applyCount").textContent =
          `선택 ${applicable.length}권` +
          (hidden ? ` · 숨겨진 선택 ${hidden}권은 적재하지 않음` : "");
        $("applyBtn").textContent = `선택 ${applicable.length}권 적재`;
        $("applyBtn").disabled = state.busy || applicable.length === 0;
      }

      // ── 카드 ──────────────────────────────────────────────────

      function setChecked(entry, checked) {
        if (entry.done || state.busy) return;
        entry.checked = checked;
        entry.box.checked = checked;
        entry.card.classList.toggle("off", !checked);
        if (state.detail === entry) $("detailPick").checked = checked;
        updateApplyBar();
      }

      function bookCard(book, order, checked) {
        const entry = { book, order, checked, done: false };
        const box = el("input", {
          type: "checkbox",
          "aria-label": `${book.title} 적재 대상`,
        });
        box.checked = checked;
        const stamp = el("div", { class: "stamp" });
        const img = el("img", {
          src: book.thumbnail,
          alt: "",
          loading: "lazy",
          referrerpolicy: "no-referrer",
        });
        const people = [book.author || "(저자 없음)"];
        if (book.translators.length)
          people.push(`옮김 ${book.translators.join(", ")}`);
        const card = el(
          "div",
          {
            class: checked ? "card" : "card off",
            tabindex: "0",
            role: "button",
            "aria-label": `${book.title} 상세 보기`,
          },
          [
            box,
            img,
            el("div", { class: "title", text: book.title }),
            el("div", { class: "meta", text: book.publisher }),
            el("div", { class: "meta", text: people.join(" · ") }),
            el("div", { class: "meta" }, [
              document.createTextNode(
                `${book.pubDate ?? "날짜 없음"} · ${won(book.discount)}`,
              ),
              book.preorder
                ? el("span", { class: "badge", text: "예약" })
                : null,
            ]),
            book.salesPoint !== null
              ? el("div", {
                  class: "meta sales",
                  text: `판매지수 ${book.salesPoint.toLocaleString()}`,
                })
              : null,
            stamp,
          ],
        );
        box.addEventListener("click", (e) => {
          e.stopPropagation();
          setChecked(entry, box.checked);
        });
        card.addEventListener("click", () => openDetail(entry));
        card.addEventListener("keydown", (e) => {
          if (e.target !== card) return;
          if (e.key === "Enter") openDetail(entry);
          if (e.key === " ") {
            e.preventDefault();
            setChecked(entry, !entry.checked);
          }
        });
        Object.assign(entry, { card, stamp, box });
        state.fresh.set(book.isbn, entry);
        return entry;
      }

      // ── 상세 보기 ─────────────────────────────────────────────

      function openDetail(entry) {
        state.detail = entry;
        const { book } = entry;
        const source = sourceById(book.source);
        $("detailImg").src = book.thumbnail;
        $("detailTitle").textContent = book.title;
        const rows = [
          ["저자", book.author || "(없음)"],
          ["역자", book.translators.join(", ")],
          ["출판사", book.publisher],
          [
            "출간일",
            (book.pubDate ?? "없음") + (book.preorder ? " (예약판매)" : ""),
          ],
          ["정가", won(book.discount)],
          [
            "판매지수",
            book.salesPoint === null
              ? "없음 — NULL로 들어갑니다"
              : book.salesPoint.toLocaleString(),
          ],
          ["카테고리", book.category ?? ""],
          ["판매 상태", book.status],
          ["ISBN-13", book.isbn],
          ["ISBN-10", book.isbn10 ?? ""],
        ].filter(([, v]) => v);
        $("detailMeta").replaceChildren(
          ...rows.flatMap(([k, v]) => [
            el("dt", { text: k }),
            el("dd", { text: v }),
          ]),
          ...(book.link
            ? [
                el("dt", { text: "원본" }),
                el("dd", {}, [
                  el("a", {
                    href: book.link,
                    target: "_blank",
                    rel: "noopener noreferrer",
                    text: `${source?.label ?? book.source}에서 보기`,
                  }),
                ]),
              ]
            : []),
        );
        $("detailDesc").textContent =
          (book.description || "(소개 없음)") +
          (source?.enrichNote ? `\n\n※ ${source.enrichNote}` : "");
        $("detailPick").checked = entry.checked;
        $("detailPick").disabled = entry.done || state.busy;
        const list = visibleEntries();
        const at = list.indexOf(entry);
        $("detailPos").textContent =
          at >= 0 ? `${at + 1} / ${list.length}` : "";
        $("prevBtn").disabled = at <= 0;
        $("nextBtn").disabled = at < 0 || at >= list.length - 1;
        if (!$("detail").open) $("detail").showModal();
      }

      function stepDetail(delta) {
        const list = visibleEntries();
        const next = list[list.indexOf(state.detail) + delta];
        if (next) openDetail(next);
      }

      $("prevBtn").addEventListener("click", () => stepDetail(-1));
      $("nextBtn").addEventListener("click", () => stepDetail(1));
      $("closeBtn").addEventListener("click", () => $("detail").close());
      $("detailPick").addEventListener("change", (e) =>
        setChecked(state.detail, e.target.checked),
      );
      $("detail").addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") stepDetail(-1);
        if (e.key === "ArrowRight") stepDetail(1);
      });
      $("detail").addEventListener("click", (e) => {
        // 바깥(backdrop)을 누르면 닫는다
        if (e.target === $("detail")) $("detail").close();
      });
      $("detail").addEventListener("close", () => {
        state.detail?.card.focus();
        state.detail = null;
      });

      // ── 결과 ──────────────────────────────────────────────────

      function renderResults(sections) {
        state.fresh.clear();
        state.sections = [];
        const label = sourceById(state.scanSource)?.label ?? state.scanSource;
        const nodes = sections.map(({ summary, fresh, known, excluded }) => {
          const count = el("span", { class: "small muted" });
          const head = el("div", { class: "pub-head" }, [
            el("h2", { style: "margin:0", text: summary.label }),
            el("span", {
              class: "small muted",
              text:
                `${label} ${summary.totalCount.toLocaleString()}권 중 ${summary.pages}페이지 확인 · 신규 ${summary.fresh} · 보유 ${summary.known} · 제외 ${summary.excluded}` +
                (summary.preorder ? ` · 예약 ${summary.preorder}` : "") +
                (summary.emptyAuthor
                  ? ` · 저자 없음 ${summary.emptyAuthor}`
                  : ""),
            }),
          ]);
          // 검색 결과에는 해외판·다른 판본이 섞이므로 고른 것만 적재한다
          const preselect = summary.kind !== "keyword";
          const entries = fresh.map((book, i) => bookCard(book, i, preselect));
          const grid = el("div", { class: "grid" });
          const section = { entries, grid, count };
          state.sections.push(section);
          const bulk = (checked) => () =>
            entries.filter(isVisible).forEach((e) => setChecked(e, checked));
          const tools = entries.length
            ? el("div", { class: "row small", style: "margin-top:8px" }, [
                el("button", {
                  text: "보이는 것 모두 선택",
                  onclick: bulk(true),
                }),
                el("button", {
                  text: "보이는 것 모두 해제",
                  onclick: bulk(false),
                }),
                count,
              ])
            : el("p", {
                class: "muted small",
                text:
                  summary.kind === "keyword"
                    ? "DB에 없는 책이 없습니다."
                    : "새로 들어온 책이 없습니다.",
              });
          const knownTable = known.length
            ? el("details", {}, [
                el("summary", {
                  class: "small muted",
                  text: `이미 있는 책 ${known.length}권 보기`,
                }),
                el("table", {}, [
                  el("tr", {}, [
                    el("th", { text: "ISBN" }),
                    el("th", { text: "제목" }),
                    el("th", { text: "저자" }),
                    el("th", { text: "출간일" }),
                  ]),
                  ...known.map((b) =>
                    el("tr", {}, [
                      el("td", { text: b.isbn }),
                      el("td", { text: b.title }),
                      el("td", { text: b.author }),
                      el("td", { text: b.pubDate ?? "" }),
                    ]),
                  ),
                ]),
              ])
            : null;
          const excludedTable = excluded.length
            ? el("details", {}, [
                el("summary", {
                  class: "small muted",
                  text: `제외 ${excluded.length}건 보기`,
                }),
                el("table", {}, [
                  el("tr", {}, [
                    el("th", { text: "사유" }),
                    el("th", { text: "ISBN" }),
                    el("th", { text: "제목" }),
                  ]),
                  ...excluded.map((e) =>
                    el("tr", {}, [
                      el("td", { text: e.label }),
                      el("td", { text: e.isbn ?? "" }),
                      el("td", { text: e.title }),
                    ]),
                  ),
                ]),
              ])
            : null;
          return el("div", { class: "pub" }, [
            head,
            tools,
            grid,
            knownTable,
            excludedTable,
          ]);
        });
        $("results").replaceChildren(...nodes);
        $("toolbar").hidden = state.fresh.size === 0;
        // 판매지수가 하나도 없으면(카카오) 그 정렬은 의미가 없다
        const hasSales = [...state.fresh.values()].some(
          (e) => e.book.salesPoint !== null,
        );
        $("sort").querySelector('[value="sales"]').disabled = !hasSales;
        if (!hasSales && state.view.sort === "sales") {
          state.view.sort = "source";
          $("sort").value = "source";
        }
        $("log").textContent = "";
        $("meter").style.width = "0";
        applyView();
      }

      $("query").addEventListener("input", (e) => {
        state.view.query = e.target.value.trim().toLowerCase();
        applyView();
      });
      $("hidePreorder").addEventListener("change", (e) => {
        state.view.hidePreorder = e.target.checked;
        applyView();
      });
      $("sort").addEventListener("change", (e) => {
        state.view.sort = e.target.value;
        applyView();
      });

      // ── 조회·적재 ─────────────────────────────────────────────

      function scan() {
        const publishers = [...state.selected];
        return runScan(publishers, {
          publishers,
          maxPages: Number($("maxPages").value),
        });
      }

      function search(event) {
        event.preventDefault();
        const text = $("searchText").value.trim();
        if (!text || state.busy) return;
        // 서버가 검색어를 정리해 이름을 붙이므로(ISBN 하이픈 등) 미리 줄을 만들지 않는다
        return runScan([], {
          query: {
            text,
            field: $("searchField").value,
            sort: $("searchSort").value,
          },
          maxPages: Number($("searchPages").value),
        });
      }

      async function runScan(labels, body) {
        const source = state.source;
        setBusy(true);
        $("progressPanel").hidden = false;
        const totals = new Map(labels.map((p) => [p, null]));
        const label = sourceById(source)?.label ?? source;
        const draw = () => {
          if (totals.size === 0) {
            $("progress").textContent = `${label} · 조회 중`;
            return;
          }
          $("progress").textContent = [...totals.entries()]
            .map(([p, t]) =>
              t
                ? `${label} · ${p} · ${t.page}페이지 · 신규 ${t.fresh} · 보유 ${t.known} · 제외 ${t.excluded}`
                : `${label} · ${p} · 대기`,
            )
            .join("\n");
        };
        $("progress").style.whiteSpace = "pre-line";
        draw();
        try {
          await stream("/api/scan", { source, ...body }, (ev) => {
            if (ev.type === "page") {
              const t = totals.get(ev.label) ?? {
                page: 0,
                fresh: 0,
                known: 0,
                excluded: 0,
              };
              totals.set(ev.label, {
                page: ev.page,
                fresh: t.fresh + ev.fresh,
                known: t.known + ev.known,
                excluded: t.excluded + ev.excluded,
              });
              draw();
            } else if (ev.type === "result") {
              state.scanId = ev.scanId;
              state.scanSource = source;
              renderResults(ev.sections);
            } else if (ev.type === "error") {
              throw new Error(ev.message);
            }
          });
        } catch (error) {
          $("progress").append(
            el("div", { class: "error", text: `실패: ${error.message}` }),
          );
        } finally {
          setBusy(false);
        }
      }

      async function apply() {
        const entries = selectedEntries().filter(isVisible);
        const isbns = entries.map((e) => e.book.isbn);
        if (!isbns.length) return;
        const label = sourceById(state.scanSource)?.label ?? "";
        if (
          !confirm(
            `${label}에서 찾은 ${isbns.length}권을 운영 DB에 적재합니다.\n표지를 R2에 올린 뒤 books와 book_dimensions에 INSERT합니다. 진행할까요?`,
          )
        )
          return;
        setBusy(true);
        const log = (text) => {
          $("log").textContent += text + "\n";
          $("log").scrollTop = 1e9;
        };
        const LABEL = {
          inserted: "적재",
          already_exists: "이미 있음",
          failed: "실패",
        };
        try {
          await stream("/api/apply", { scanId: state.scanId, isbns }, (ev) => {
            if (ev.type === "book") {
              const entry = state.fresh.get(ev.outcome.isbn);
              // 실패한 책은 선택된 채로 남겨 바로 다시 적재할 수 있게 한다
              entry.done = ev.outcome.status !== "failed";
              entry.stamp.textContent = LABEL[ev.outcome.status];
              entry.stamp.className = `stamp ${ev.outcome.status} show`;
              $("meter").style.width = `${((ev.index + 1) / ev.total) * 100}%`;
              log(
                `${ev.index + 1}/${ev.total} ${LABEL[ev.outcome.status]} ${ev.outcome.isbn} ${ev.title}` +
                  describeOutcome(ev.outcome),
              );
            } else if (ev.type === "done") {
              const s = ev.summary;
              log(
                `끝 — 적재 ${s.inserted} · 이미 있음 ${s.alreadyExists} · 실패 ${s.failed} · 표지 재사용 ${s.reusedCovers} · 저자 없음 ${s.emptyAuthor}` +
                  ` · 판형 행 ${s.dimensionRows}(실측 ${s.measured})` +
                  (s.colorFailed ? ` · 표지색 실패 ${s.colorFailed}` : "") +
                  `\n기록: ${s.journal}`,
              );
            } else if (ev.type === "error") {
              throw new Error(ev.message);
            }
          });
        } catch (error) {
          log(`중단: ${error.message}`);
        } finally {
          setBusy(false);
        }
      }

      function describeOutcome(o) {
        if (o.status === "failed") return ` — ${o.error}`;
        const d = o.dimension;
        const dims = d.dimensions;
        const size = dims
          ? [
              dims.width && dims.height
                ? `${dims.width}×${dims.height}${dims.depth ? `×${dims.depth}` : ""}mm`
                : dims.depth
                  ? `두께 ${dims.depth}mm`
                  : null,
              dims.pages && `${dims.pages}쪽`,
            ]
              .filter(Boolean)
              .join(" ")
          : "";
        return (
          " (" +
          [
            o.cover?.reused ? "표지 재사용" : null,
            size ? `판형 ${size}` : "판형 없음",
            d.coverColor ?? `표지색 실패: ${d.colorError}`,
            d.written ? null : "판형 행 추가 안 함",
          ]
            .filter(Boolean)
            .join(" · ") +
          ")"
        );
      }

      $("filter").addEventListener("input", renderChips);
      $("scanBtn").addEventListener("click", scan);
      $("keywordMode").addEventListener("submit", search);
      $("searchText").addEventListener("input", renderSearch);
      $("applyBtn").addEventListener("click", apply);

      (async () => {
        try {
          const [meta, pubs, favs] = await Promise.all([
            api("/api/meta").then((r) => r.json()),
            api("/api/publishers?limit=2000").then((r) => r.json()),
            api("/api/favorites").then((r) => r.json()),
          ]);
          $("target").textContent = `DB ${meta.target}`;
          state.sources = meta.sources;
          const remembered = sourceById(store.get(SOURCE_KEY));
          state.source = (
            remembered?.available
              ? remembered
              : meta.sources.find((s) => s.available)
          )?.id;
          state.publishers = pubs;
          state.favorites = new Set(favs);
          for (const name of favs)
            if (!pubs.some((p) => p.publisher === name))
              state.publishers.push({ publisher: name, count: 0 });
          renderSources();
          renderMaxPages();
          renderChips();
          renderSearch();
          selectMode(store.get(MODE_KEY));
        } catch (error) {
          $("chips").replaceChildren(
            el("p", {
              class: "error",
              text: `출판사 목록을 못 불러왔습니다: ${error.message}`,
            }),
          );
        }
      })();
    </script>
  </body>
</html>
